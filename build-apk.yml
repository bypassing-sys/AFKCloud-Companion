
name: Build AFKCloud Companion APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o AFKCloud_Companion_0.1.0-1.zip -d source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix Java imports
        run: |
          python3 - <<'PY'
          p = "source/app/src/main/java/com/afkcloud/companion/CaptureService.java"
          s = open(p).read()
          s = s.replace(
              "import android.app.*;",
              "import android.app.*;\nimport android.hardware.display.DisplayManager;\nimport android.hardware.display.VirtualDisplay;"
          )
          open(p, "w").write(s)
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: source
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AFKCloud-Companion-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
